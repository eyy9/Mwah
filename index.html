<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwah ❤️</title>
    <link rel="stylesheet" href="style.css">
    <!-- استيراد مكتبة Supabase رسمياً من CDN المعتمد -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- شاشة الدخول -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>Mwah ❤️</h2>
            <input type="text" id="partner-name" placeholder="اسمك الجميل...">
            <input type="text" id="room-code" placeholder="رمز الغرفة (مثل love)...">
            <button id="join-btn">دخول للغرفة</button>
        </div>
    </div>

    <!-- الشاشة الرئيسية (دردشة ورسم) -->
    <div id="main-screen" class="screen">
        <header>
            <button id="logout-btn">خروج</button>
            <h3 id="room-title">غرفة</h3>
        </header>
        
        <div id="connection-status" class="status-banner">جارٍ الاتصال بالغرفة...</div>

        <div class="canvas-container">
            <canvas id="drawing-canvas"></canvas>
            <div class="tools-bar">
                <button id="eraser-btn">ممحاة</button>
                <input type="range" id="brush-size" min="1" max="20" value="5">
                <input type="color" id="color-picker" value="#d90429">
                <button id="clear-canvas-btn">مسح الكل</button>
            </div>
        </div>

        <div class="chat-container">
            <div id="messages-list"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالة لحبيبتك...">
                <button id="send-msg-btn">إرسال</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
