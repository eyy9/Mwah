<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواح - Mawah</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <div class="heart-icon">💖</div>
            <h1>مواح - Mawah</h1>
            <p class="subtitle">«مكان إلنا نحن الاثنين»</p>
            <p class="quote">«خلينا نرسم شيئاً يشبهنا»</p>
            <p class="sub-quote">«رسمة منك.. ورسمة مني... وكلها تبقى في مكان واحد يجمعنا مهما تباعدت المسافات.»</p>

            <div class="input-group">
                <label for="partner-name">اسمك في المساحة (مثل: حبيبي أو جوري)</label>
                <input type="text" id="partner-name" placeholder="جوري">
            </div>

            <button id="join-btn" class="primary-btn">أنشئ مساحتنا 💖</button>
            
            <div class="input-group" style="margin-top: 20px;">
                <label for="room-code">أو انضم برمز دعوة</label>
                <input type="text" id="room-code" placeholder="ABCDEGHI">
            </div>
        </div>
    </div>

    <!-- الشاشة الرئيسية (الرسم والدردشة) -->
    <div id="main-screen" class="screen">
        <header class="app-header">
            <h2 id="room-title">غرفة المساحة</h2>
            <button id="logout-btn" class="secondary-btn">خروج</button>
        </header>

        <div class="workspace">
            <!-- قسم الرسم -->
            <div class="canvas-container">
                <div class="canvas-tools">
                    <input type="color" id="color-picker" value="#ff4d6d">
                    <input type="range" id="brush-size" min="1" max="20" value="5">
                    <button id="eraser-btn">ممحاة</button>
                    <button id="clear-canvas-btn">مسح الكل</button>
                </div>
                <canvas id="drawing-canvas"></canvas>
            </div>

            <!-- قسم الدردشة -->
            <div class="chat-container">
                <div id="messages-list" class="messages-list"></div>
                <div class="chat-input-area">
                    <input type="text" id="message-input" placeholder="اكتب رسالة لطيفة...">
                    <button id="send-msg-btn">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <span class="netlify-badge">Powered by Netlify</span>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
